name: Fetch Orac Hero Asset

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  fetch-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Download Orac hero image
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153.0 Safari/537.36" \
            -H "Referer: https://www.oracdecor.com/en_us/" \
            -o hero-RoelfienVos_1.png \
            "https://www.oracdecor.com/media/wysiwyg/homepage/hero-RoelfienVos_1.png"
          file hero-RoelfienVos_1.png
          ls -lh hero-RoelfienVos_1.png
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: orac-hero
          path: hero-RoelfienVos_1.png
          if-no-files-found: error
